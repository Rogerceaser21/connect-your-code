name: Deploy to GitHub Pages

# Two channels, one Pages site:
#   /focus-os/          <- DEPLOYED: builds from main (only Igor-approved versions)
#   /focus-os/preview/  <- PREVIEW: builds from the work branch, every push
# Any push to either branch rebuilds BOTH channels so they stay consistent.
on:
  push:
    branches: [main, redesign/liquid-glass]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: deployed
      - uses: actions/checkout@v4
        with:
          ref: redesign/liquid-glass
          path: preview
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            deployed/package-lock.json
            preview/package-lock.json
      - run: npm ci
        working-directory: deployed
      - run: npm run build
        working-directory: deployed
        env:
          VITE_BASE: /focus-os/
      - run: npm ci
        working-directory: preview
      - run: npm run build
        working-directory: preview
        env:
          VITE_BASE: /focus-os/preview/
      - name: Assemble site (deployed at root, latest preview under /preview)
        run: |
          mkdir site
          cp -R deployed/dist/. site/
          mkdir -p site/preview
          cp -R preview/dist/. site/preview/
          # SPA fallback: Pages serves the root 404.html for ALL unknown paths.
          # Deployed deep links keep the index-copy fallback; preview deep
          # links bounce to the preview home first.
          cp site/index.html site/404.html
          sed -i 's|<head>|<head><script>if(location.pathname.indexOf("/focus-os/preview/")===0)location.replace("/focus-os/preview/");</script>|' site/404.html
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Pages names each deployment after the commit sha that triggered the run
      # and silently reuses an existing deployment with the same sha, while the
      # run still reports success. A fast-forward merge pushes main at the exact
      # sha the preview branch already deployed, so that main run changes nothing
      # (v66 2026-09-11, v67 2026-09-12). The sha cannot be overridden here: a
      # step-level env GITHUB_SHA never reaches the action (runs 34582627243 and
      # 34692789907 both sent the plain sha). Rule: right after every fast-forward
      # merge to main, push one new commit to redesign/liquid-glass (an empty
      # commit is fine). Its run has a fresh sha and rebuilds both channels, the
      # deployed one from main. Then grep the served index-*.js for the short sha.
      - id: deployment
        uses: actions/deploy-pages@v4
