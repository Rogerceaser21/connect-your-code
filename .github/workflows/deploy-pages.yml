name: Deploy to GitHub Pages

# Two channels, one Pages site:
#   /focus-os/          <- DEPLOYED: builds from main (only Igor-approved versions)
#   /focus-os/preview/  <- PREVIEW: builds from the work branch, every push
# Any push to either branch rebuilds BOTH channels so they stay consistent.
on:
  push:
    branches: [main, redesign/liquid-glass]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: deployed
      - uses: actions/checkout@v4
        with:
          ref: redesign/liquid-glass
          path: preview
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            deployed/package-lock.json
            preview/package-lock.json
      - run: npm ci
        working-directory: deployed
      - run: npm run build
        working-directory: deployed
        env:
          VITE_BASE: /focus-os/
      - run: npm ci
        working-directory: preview
      - run: npm run build
        working-directory: preview
        env:
          VITE_BASE: /focus-os/preview/
      - name: Assemble site (deployed at root, latest preview under /preview)
        run: |
          mkdir site
          cp -R deployed/dist/. site/
          mkdir -p site/preview
          cp -R preview/dist/. site/preview/
          # SPA fallback: Pages serves the root 404.html for ALL unknown paths.
          # Deployed deep links keep the index-copy fallback; preview deep
          # links bounce to the preview home first.
          cp site/index.html site/404.html
          sed -i 's|<head>|<head><script>if(location.pathname.indexOf("/focus-os/preview/")===0)location.replace("/focus-os/preview/");</script>|' site/404.html
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        # Pages names a deployment by GITHUB_SHA and skips a second deployment that
        # carries the same name. A fast-forward merge pushes main at the sha the
        # preview branch already deployed, so the main run "succeeded" without
        # changing the site (v66, 2026-09-11). Make every run's version unique.
        env:
          GITHUB_SHA: ${{ github.sha }}-${{ github.run_id }}
